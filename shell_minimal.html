<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
    <link rel="icon" href="data:,">
    <title>rvsim | RISC-V Simulator</title>
    <style>
        body { margin: 0; background-color: black; overflow: hidden; }
        /* FIXME: with our GLFW example this block seems to break resizing and io.DisplaySize gets stuck */
        .emscripten {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
        #canvas:focus {
          outline: none;
        }
        #coi-status {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #e5e7eb;
            background: rgba(0, 0, 8, 0.92);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 16px;
            text-align: center;
            z-index: 10;
        }
    </style>
  </head>
  <body>
    <div id="coi-status"></div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <script type='text/javascript'>
      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
            return function(text) {
                text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            };
        })(),
        printErr: function(text) {
            text = Array.prototype.slice.call(arguments).join(' ');
            console.error(text);
        },
        canvas: (function() {
            var canvas = document.getElementById('canvas');
            //canvas.addEventListener("webglcontextlost", function(e) { alert('FIXME: WebGL context lost, please reload the page'); e.preventDefault(); }, false);
            return canvas;
        })(),
        setStatus: function(text) {
            console.log("status: " + text);
        },
        monitorRunDependencies: function(left) {
            // no run dependencies to log
        }
      };
      window.onerror = function() {
        console.log("onerror: " + event);
      };
    </script>
    <script src="coi-serviceworker.js"></script>
    <template id="emscripten-script">{{{ SCRIPT }}}</template>
    <script type="text/javascript">
      (function () {
        const statusEl = document.getElementById('coi-status');
        function showStatus(msg) {
          if (!statusEl) return;
          statusEl.textContent = msg;
          statusEl.style.display = 'flex';
        }
        if (window.crossOriginIsolated) {
          const tpl = document.getElementById('emscripten-script');
          for (const node of tpl.content.querySelectorAll('script')) {
            const s = document.createElement('script');
            for (const attr of node.attributes) {
              s.setAttribute(attr.name, attr.value);
            }
            s.textContent = node.textContent;
            document.body.appendChild(s);
          }
        } else if (!window.isSecureContext) {
          showStatus('rvsim requires a secure context (HTTPS or localhost) with Cross-Origin Isolation enabled.');
        } else if (!('serviceWorker' in navigator)) {
          showStatus('Cross-Origin Isolation is unavailable (Service Workers disabled, e.g. private browsing).');
        } else {
          showStatus('Initializing multi-threaded WebAssembly environment...');
        }
      })();
    </script>
  </body>
</html>
